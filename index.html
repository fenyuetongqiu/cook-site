<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f0">
<title>宝贝之家小厨房</title>
<style>
:root{
  --bg:#fff8f0; --card:#ffffff; --ink:#3a2e28; --ink2:#8a7a6e; --line:#f0e2d2;
  --brand:#e8752c; --brand2:#ffb163; --ok:#3f9c5a; --bad:#d9534f;
  --soft:var(--soft); --softink:var(--softink); --soft2:var(--soft2); --gray1:var(--gray1); --line2:var(--line2);
  --shadow:0 2px 10px rgba(120,80,40,.08); --r:18px;
}
body[data-theme="mint"]{--bg:#f4fbf7;--ink:#28322d;--ink2:#7d8a83;--line:#dcece3;--brand:#37a173;--brand2:#8ed8b6;--soft:#e6f6ee;--softink:#2c7a58;--soft2:#f2fbf6;--gray1:#e7efe9;--line2:#d6e9de;--shadow:0 2px 10px rgba(60,120,90,.08)}
body[data-theme="blue"]{--bg:#f3f8fd;--ink:#262f3a;--ink2:#7b8896;--line:#dbe7f2;--brand:#3d7fd0;--brand2:#93bdec;--soft:#e7f1fb;--softink:#2c5f9e;--soft2:#f1f7fd;--gray1:#e6edf4;--line2:#d4e3f0;--shadow:0 2px 10px rgba(60,100,140,.08)}
body[data-theme="pink"]{--bg:#fdf5f7;--ink:#362830;--ink2:#8d7b85;--line:#f2dfe5;--brand:#d2688f;--brand2:#f0a9c2;--soft:#fbe9f0;--softink:#a34569;--soft2:#fdf3f7;--gray1:#f5e6ec;--line2:#f0d8e2;--shadow:0 2px 10px rgba(140,70,100,.08)}
body[data-theme="grape"]{--bg:#f7f5fc;--ink:#2d2a3a;--ink2:#82809a;--line:#e4dff2;--brand:#7a63d0;--brand2:#b3a3ec;--soft:#efeafb;--softink:#58449e;--soft2:#f6f3fd;--gray1:#eae5f5;--line2:#e0daf2;--shadow:0 2px 10px rgba(100,80,160,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding-bottom:86px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#fff8f0 70%,rgba(255,248,240,.88));padding:12px 14px 6px;backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px rgba(232,117,44,.14)}
.brand small{font-weight:400;color:var(--ink2);font-size:12px;margin-left:auto;display:flex;align-items:center;gap:6px}
.mini{font-size:12px;border:0;background:var(--soft);color:var(--softink);border-radius:8px;padding:4px 8px;cursor:pointer}
nav{display:flex;gap:6px;margin-top:10px;background:var(--soft);border-radius:12px;padding:4px}
nav button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font-size:14px;color:var(--ink2);font-weight:600;cursor:pointer}
nav button.on{background:#fff;color:var(--brand);box-shadow:var(--shadow)}
main{padding:8px 14px 20px}
.search{display:flex;gap:8px;margin:4px 0 10px}
.search input{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font-size:15px;outline:none}
.search input:focus{border-color:var(--brand2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
#sheet h2{font-size:18px;font-weight:700;color:#3f332b;margin:0 0 10px}
#sheet input,#sheet textarea,#sheet select{border-radius:14px!important;border:1px solid #f2e2d2!important;background:#fffdfa!important;padding:12px 14px!important;font-size:15px!important;box-shadow:none!important;transition:border-color .15s,box-shadow .15s}
#sheet input:focus,#sheet textarea:focus,#sheet select:focus{outline:none!important;border-color:#ffc79a!important;box-shadow:0 0 0 3px #fff3e6!important}
#sheet .chip{border-radius:999px!important;border:1px solid #f1e3d6!important;background:#fffdfa!important;padding:9px 15px!important;font-size:14px!important;color:#6f5a4a!important;box-shadow:0 1px 0 #f6ece2}
#sheet .chip.on{background:#ffe9d2!important;border-color:#ffcfa4!important;color:#bd5b14!important;font-weight:600!important}
#sheet .btn{border-radius:16px!important}
#sheet .btn.mini{border-radius:14px!important}
.frmsec{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:14px;color:#8b6a52;font-weight:600}
.frmsec i{display:inline-flex;width:21px;height:21px;border-radius:50%;background:#ffe7d1;color:#c4661c;font-style:normal;font-size:11.5px;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.frmhead{background:linear-gradient(135deg,#fff6ec,#ffeef3);border-radius:20px;padding:14px 16px;margin:2px 0 6px}
.frmhead b{display:block;font-size:16px;color:#c9611f;letter-spacing:.2px}
.frmhead span{display:block;font-size:12.5px;color:#a08a7a;margin-top:4px}
.frmpick{display:flex;flex-wrap:wrap;gap:8px;max-height:190px;overflow:auto;padding:10px;border-radius:16px;background:#fffaf4;border:1px solid #f6e8da}
.frmpick::-webkit-scrollbar{width:6px}
.frmpick::-webkit-scrollbar-thumb{background:#f0dcc7;border-radius:6px}
.frmpick .chip{padding:8px 13px!important;font-size:13.5px!important}
.needchips b.del{opacity:.55;margin-left:2px}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink2);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.card .emoji{font-size:26px;line-height:1}
.card h3{margin:0;font-size:15px}
.meta{color:var(--ink2);font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{background:var(--soft);color:var(--softink);border-radius:6px;padding:1px 6px;font-size:11px}
.taste{background:#e8f3ec;color:#2f7a49}
.btn{border:0;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand2)}
.btn.mini{padding:7px 10px;font-size:13px}
.btn.gray{background:var(--gray1);color:#7a6a5e}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.miss{font-size:12px;color:var(--bad)}
.have{font-size:12px;color:var(--ok)}
.sect{margin:14px 0 8px;display:flex;align-items:baseline;gap:8px}
.sect h2{margin:0;font-size:15px;font-weight:700}
.sect span{color:var(--ink2);font-size:12px}
.empty{color:var(--ink2);text-align:center;padding:26px 10px;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;box-shadow:0 -4px 16px rgba(120,80,40,.07)}
.bar .cnt{font-weight:700;font-size:14px}
.bar .cnt small{display:block;color:var(--ink2);font-weight:400;font-size:12px}
.bar .btn{flex:1}
.mask{position:fixed;inset:0;background:rgba(40,26,18,.42);z-index:40;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:2px 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.sheet .close{margin-left:auto;border:0;background:var(--gray1);color:#7a6a5e;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row label{font-size:13px;color:var(--ink2);min-width:64px}
.row input,.row select,.row textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;outline:none;background:#fff}
.row textarea{min-height:60px;resize:vertical}
.olist{display:flex;flex-direction:column;gap:9px}
.order{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.order .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.order .top b{font-size:15px}
.st{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.st.wait{background:#fff2d8;color:#a86d10}
.st.doing{background:#e7f0ff;color:#2b62b8}
.st.reject{background:#fdeceb;color:#c0392b}
.st.done{background:#e6f4ea;color:#2f7a49}
.order .note{color:var(--ink2);font-size:13px;margin-top:4px;white-space:pre-wrap}
.order .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ing{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.ing b{font-weight:600;font-size:14px}
.ing span{color:var(--ink2);font-size:13px}
.ing .x{margin-left:auto;border:0;background:#fdeceb;color:#c0392b;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
.steps{margin:8px 0 0;padding-left:20px}
.steps li{margin:6px 0;font-size:14px}
.intro{color:#5f5145;font-size:14px;background:#fffaf3;border:1px dashed var(--line);border-radius:10px;padding:10px;margin:8px 0}
.tip{font-size:13px;color:#8a6a3a;background:var(--soft2);border-radius:10px;padding:9px 11px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,12px);z-index:60;background:rgba(50,34,24,.92);color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tipbar{background:var(--soft2);border:1px solid var(--line2);color:#8a6a3a;border-radius:10px;padding:9px 11px;font-size:13px;margin:4px 0 10px}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:15px;line-height:1;cursor:pointer}
/* 登录 */
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 16px 40px}
.login h1{font-size:22px;margin:0 0 4px;text-align:center}
.login p{margin:0;text-align:center;color:var(--ink2);font-size:13px}
.roles{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.role{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;cursor:pointer}
.role .big{font-size:30px}
.role b{font-size:16px;display:block}
.role span{font-size:12px;color:var(--ink2)}
.syncbadge{font-size:11px;border-radius:999px;padding:2px 8px;background:#eef; color:#3b5bdb}
.syncbadge.off{background:var(--gray1);color:#8a7a6e}
.syncbadge.err{background:#fdeceb;color:#c0392b}

/* ---- 圆角统一：一块一块都圆着 ---- */
.card,.order,.role,.frmhead,.frmpick,.tipbar,.ing,.intro,.tip{border-radius:20px!important}
.card{border-radius:22px!important}
nav,.search input,.qty button{border-radius:16px!important}
.btn{border-radius:14px!important}
.chip{border-radius:999px!important}
.sheet{border-radius:28px 28px 0 0!important}
/* ---- 配色盘 ---- */
.themeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.swatch{display:flex;align-items:center;gap:8px;border:1px solid var(--line)!important;background:#fffdfa;border-radius:18px!important;padding:12px;font-size:14px;color:var(--ink);cursor:pointer}
.swatch.on{border-color:var(--brand)!important;box-shadow:0 0 0 3px var(--soft)}
.swatch .dot{width:16px;height:16px;border-radius:50%;display:inline-block;flex:0 0 auto}
.swatch b{font-weight:600}
.ic{width:15px;height:15px;vertical-align:-2px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-right:5px}
.editb{margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--brand);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;cursor:pointer}
.delx{border:0;background:#fdeceb;color:#c0392b;border-radius:999px;width:22px;height:22px;font-size:12px;line-height:1;cursor:pointer;vertical-align:middle}
.brand .who{display:inline-block;margin-right:6px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--brand);font-size:12px}
#tourbox{position:fixed;left:10px;right:10px;bottom:14px;z-index:99999;background:var(--card);border-radius:20px;box-shadow:0 12px 34px rgba(60,40,20,.22);padding:14px 16px 12px;display:none;border:1px solid var(--line)}
#tourbox.on{display:block}
#tourbox .tstep{font-size:12px;color:var(--brand);font-weight:600}
#tourbox .ttitle{font-size:16px;font-weight:700;margin:3px 0 4px;color:var(--ink)}
#tourbox .ttext{font-size:13px;color:var(--ink2);line-height:1.55}
#tourbox .tacts{display:flex;gap:8px;justify-content:flex-end;margin-top:11px}
.tour-hit{box-shadow:0 0 0 3px var(--brand),0 8px 22px rgba(0,0,0,.14)!important;position:relative;z-index:9000;border-radius:18px}
.nbd{display:inline-block;margin-left:5px;padding:0 6px;border-radius:999px;background:var(--brand);color:#fff;font-size:11px;font-weight:600;line-height:16px;vertical-align:middle}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<div class="bar" id="bar"></div>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div id="tourbox"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';

/* ============ 菜谱 ============ */
var SEED_RECIPES = [
  {id:'tomato-egg',name:'番茄炒蛋',emoji:'🍅',time:10,level:'简单',taste:['家常','酸甜'],
   need:[{n:'番茄',a:'2个'},{n:'鸡蛋',a:'3个'},{n:'葱',a:'1根'}],
   intro:'最不会翻车的一道，酸甜下饭。番茄要炒出汁，蛋要嫩。',
   steps:['鸡蛋打散加一小撮盐，番茄切块，葱切末。','热锅倒油，油热下蛋液，稍微凝固就盛出。','余油下番茄，中火炒到出汁变软，加半勺糖、少许盐。','倒回鸡蛋翻两下，撒葱末出锅。'],
   tip:'番茄先去蒂划十字用开水烫一下更好去皮；糖能压酸味。'},
  {id:'potato-shred',name:'醋溜土豆丝',emoji:'🥔',time:12,level:'简单',taste:['爽口','酸辣'],
   need:[{n:'土豆',a:'2个'},{n:'青椒',a:'1个'},{n:'蒜',a:'2瓣'},{n:'醋',a:'适量'}],
   intro:'脆爽开胃，切丝越细越好吃。泡水去淀粉是关键。',
   steps:['土豆切细丝，泡清水里洗两遍去淀粉，捞出沥干。','青椒切丝，蒜切片。','热油爆香蒜，下土豆丝大火快炒1分钟。','加青椒、盐、白醋，炒匀出锅。'],
   tip:'全程大火，炒久了就软塌了；多滴几滴白醋更脆。'},
  {id:'pepper-pork',name:'青椒肉丝',emoji:'🌶️',time:15,level:'中等',taste:['家常','下饭'],
   need:[{n:'猪肉',a:'200g'},{n:'青椒',a:'2个'},{n:'蒜',a:'2瓣'},{n:'生抽',a:'适量'}],
   intro:'肉丝滑嫩、青椒脆香，配米饭一绝。',
   steps:['猪肉切丝，加生抽、少许淀粉抓匀腌10分钟。','青椒去籽切丝，蒜切片。','热油滑炒肉丝至变色盛出。','下蒜和青椒炒香，倒回肉丝，加生抽、盐翻匀。'],
   tip:'肉丝下锅前加一勺油拌一下，不容易粘锅。'},
  {id:'braised-pork',name:'红烧肉',emoji:'🍖',time:60,level:'偏难',taste:['浓香','甜咸'],
   need:[{n:'五花肉',a:'500g'},{n:'冰糖',a:'一小把'},{n:'生抽',a:'适量'},{n:'姜',a:'3片'}],
   intro:'肥而不腻、入口即化，慢火炖出来的硬菜。',
   steps:['五花肉切麻将块，冷水下锅焯水，撇沫捞出。','锅里少油下冰糖，小火炒到枣红色。','下肉块翻炒上色，加姜、生抽、料酒。','加热水没过肉，小火炖45分钟，最后大火收汁。'],
   tip:'一定加热水，冷水会让肉发紧；收汁时勤翻别糊底。'},
  {id:'tofu-map',name:'麻婆豆腐',emoji:'🍲',time:18,level:'中等',taste:['麻辣','下饭'],
   need:[{n:'豆腐',a:'1块'},{n:'猪肉',a:'100g'},{n:'豆瓣酱',a:'1勺'},{n:'葱',a:'1根'}],
   intro:'麻辣鲜香，豆腐嫩得能滑进嘴里。',
   steps:['豆腐切块，放淡盐水中泡5分钟。','肉末下锅炒散，加豆瓣酱炒出红油。','加水烧开，下豆腐轻推，煮5分钟。','勾薄芡，撒花椒粉和葱末。'],
   tip:'推豆腐用铲背，别翻炒，容易碎。'},
  {id:'egg-fried-rice',name:'蛋炒饭',emoji:'🍚',time:8,level:'简单',taste:['快手','香'],
   need:[{n:'米饭',a:'1碗'},{n:'鸡蛋',a:'2个'},{n:'葱',a:'1根'}],
   intro:'隔夜饭的救星，粒粒分明。',
   steps:['鸡蛋打散，米饭用手抓散。','热油炒蛋，半凝固就下米饭。','大火翻炒到米粒跳动，加盐。','撒葱花，出锅。'],
   tip:'隔夜饭最好；新饭摊开吹凉也行。'},
  {id:'garlic-lettuce',name:'蒜蓉生菜',emoji:'🥬',time:8,level:'简单',taste:['清淡','爽口'],
   need:[{n:'生菜',a:'1把'},{n:'蒜',a:'4瓣'}],
   intro:'三分钟上桌的清爽绿叶菜。',
   steps:['生菜洗净沥干，大蒜切末。','热油炒香蒜末。','下生菜大火快炒，变软加盐。','立刻出锅，别久炒。'],
   tip:'生菜带水容易溅油，甩干再下锅。'},
  {id:'cola-wings',name:'可乐鸡翅',emoji:'🍗',time:25,level:'简单',taste:['甜咸','小孩爱'],
   need:[{n:'鸡翅',a:'8个'},{n:'可乐',a:'1罐'},{n:'生抽',a:'适量'},{n:'姜',a:'2片'}],
   intro:'零失败甜咸味，颜色亮亮的。',
   steps:['鸡翅两面划刀，冷水下锅焯水捞出。','锅里少油，鸡翅煎到两面微黄。','倒可乐没过鸡翅，加生抽、姜片。','中火收汁到浓稠裹住鸡翅。'],
   tip:'收汁到最后要盯着，糖分高容易糊。'},
  {id:'fish-fragrant',name:'鱼香肉丝',emoji:'🥢',time:20,level:'偏难',taste:['酸甜微辣'],
   need:[{n:'猪肉',a:'200g'},{n:'胡萝卜',a:'半根'},{n:'木耳',a:'一小把'},{n:'醋',a:'适量'}],
   intro:'没有鱼却有鱼香，酸甜咸辣一条线。',

   tip:'碗汁提前调好，下锅就来不及了。'},
  {id:'di-san-xian',name:'地三鲜',emoji:'🍆',time:22,level:'中等',taste:['咸香','东北味'],
   need:[{n:'茄子',a:'1个'},{n:'土豆',a:'1个'},{n:'青椒',a:'1个'},{n:'蒜',a:'3瓣'}],

   tip:'茄子先煎比油炸省油也不腻。'},
  {id:'egg-soup',name:'紫菜蛋花汤',emoji:'🥣',time:8,level:'简单',taste:['清淡','汤'],

   intro:'饭前一碗，暖胃又快。',

  {id:'steam-egg',name:'蒸水蛋',emoji:'🥚',time:15,level:'简单',taste:['嫩','清淡'],

  {id:'cucumber',name:'凉拌黄瓜',emoji:'🥒',time:6,level:'简单',taste:['爽口','下酒'],

   intro:'拍碎比切片入味，五分钟搞定。',

   tip:'腌出来的水一定要挤掉，不然出汤。'},
  {id:'winter-melon-soup',name:'冬瓜排骨汤',emoji:'🍜',time:55,level:'中等',taste:['清甜','汤'],
   need:[{n:'冬瓜',a:'半个'},{n:'排骨',a:'400g'},{n:'姜',a:'3片'}],

  {id:'onion-egg',name:'洋葱炒蛋',emoji:'🧅',time:10,level:'简单',taste:['甜香'],

   intro:'洋葱甜、鸡蛋香，特别省事。',

  {id:'sweet-sour-pork',name:'糖醋里脊',emoji:'🍤',time:30,level:'偏难',taste:['酸甜','孩子爱'],

  {id:'noodle-tomato',name:'西红柿鸡蛋面',emoji:'🍜',time:15,level:'简单',taste:['热乎','一人食'],

  {id:'shredded-cabbage',name:'手撕包菜',emoji:'🥗',time:10,level:'简单',taste:['脆','微辣'],

   tip:'一定要大火，火小了会出水变软。'},

   tip:'想更浓可以加几块胡萝卜。'},
  {id:'tomato-beef',name:'番茄炖牛腩',emoji:'🍲',time:80,level:'偏难',taste:['浓郁','下饭'],

  {id:'rib-braise',name:'红烧排骨',emoji:'🍖',time:50,level:'偏难',taste:['浓香','甜咸'],cat:'荤菜',

   intro:'比红烧肉更好上手，排骨炖到脱骨，汤汁拌饭。',

  {id:'kungpao',name:'宫保鸡丁',emoji:'🍗',time:20,level:'中等',taste:['酸甜','微辣'],cat:'荤菜',

  {id:'twice-pork',name:'回锅肉',emoji:'🥓',time:30,level:'中等',taste:['咸香','微辣'],cat:'荤菜',

  {id:'beer-duck',name:'啤酒鸭',emoji:'🦆',time:70,level:'偏难',taste:['浓香','微辣'],cat:'荤菜',

  {id:'broccoli-garlic',name:'蒜蓉西兰花',emoji:'🥦',time:12,level:'简单',taste:['清爽','蒜香'],cat:'素菜',

  {id:'dry-beans',name:'干煸豆角',emoji:'🫘',time:20,level:'中等',taste:['干香','微辣'],cat:'素菜',

  {id:'fish-eggplant',name:'鱼香茄子',emoji:'🍆',time:25,level:'中等',taste:['酸甜','下饭'],cat:'素菜',

  {id:'scallion-pancake',name:'葱油饼',emoji:'🥞',time:30,level:'中等',taste:['香酥','咸'],cat:'主食',

  {id:'chive-pocket',name:'韭菜盒子',emoji:'🥟',time:45,level:'偏难',taste:['鲜香','家常'],cat:'主食',

  {id:'yangzhou-rice',name:'扬州炒饭',emoji:'🍚',time:15,level:'中等',taste:['咸鲜','粒粒分明'],cat:'主食',

  {id:'cold-noodle',name:'凉面',emoji:'🍜',time:20,level:'简单',taste:['酸辣','清凉'],cat:'主食',

var BUILTIN = {
  bin: 'https://extendsclass.com/api/json-storage/bin/bdeddff',

function syncTok(){ return CONF.token || BUILTIN.gh.token || ''; }
function ghMode(){ return !!syncTok(); }
function syncOn(){ return ghMode() || !!BUILTIN.bin; }
function syncName(){ return ghMode() ? 'GitHub 自动同步' : '自动同步'; }
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64dec(b64){ return decodeURIComponent(escape(atob((b64||'').replace(/\s/g,'')))); }
function apiPath(){ return '/repos/' + CONF.owner + '/' + CONF.repo + '/contents/' + CONF.path; }

function ghCall(method, path, body){
  return fetch('https://api.github.com' + path, {
    method: method,
    headers: {
      'Authorization': 'token ' + syncTok(),
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: body ? JSON.stringify(body) : undefined,
    cache: 'no-store'
  }).then(function(r){
    return r.text().then(function(txt){
      var j = null; try{ j = JSON.parse(txt); }catch(e){}
      if(!r.ok) throw new Error((j && j.message) || ('HTTP ' + r.status));
      return j;
    });
  });
}

function setSyncState(st, msg){
  SYNC.state = st; SYNC.msg = msg;
  var el = document.getElementById('syncBadge');
  if(el){ el.className = 'syncbadge ' + (st === 'on' ? '' : (st === 'err' ? 'err' : 'off')); el.textContent = msg; }
}

function pickJson(txt){
  txt = String(txt || '');
  var s = txt.search(/[\[{]/);
  if(s < 0) return null;
  var depth = 0, inStr = false, bs = false;
  for(var i = s; i < txt.length; i++){
    var ch = txt[i];
    if(inStr){
      if(bs){ bs = false; }
      else if(ch === '\\'){ bs = true; }
      else if(ch === '"'){ inStr = false; }
      continue;
    }
    if(ch === '"'){ inStr = true; continue; }
    if(ch === '{' || ch === '['){ depth++; }
    else if(ch === '}' || ch === ']'){
      depth--;
      if(depth === 0){
        try{ return JSON.parse(txt.slice(s, i + 1)); }catch(e){ return null; }
      }
    }
  }
  return null;
}

function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function binGet(url){
  return fetch(url + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.text().then(pickJson);
  });
}
function binPut(url, obj){
  return fetch(url, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(obj),
    cache: 'no-store'
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  });
}

}
function dataPut(payload){

    var body = {message: '订单更新 ' + new Date().toLocaleString('zh-CN',{hour12:false}), content: b64enc(JSON.stringify(payload)), branch: 'main'};

      .catch(function(){ return null; })
      .then(function(j){
        if(j && j.sha) body.sha = j.sha;
        return ghCall('PUT', apiPath(), body);
      });
  }
  return binPut(BUILTIN.bin, payload);
}
function imgGet(){
  if(ghMode()){

}

    var body = {message: '菜品图片 ' + new Date().toLocaleString('zh-CN',{hour12:false}), content: b64enc(JSON.stringify(obj)), branch: 'main'};

function pull(){                      // 拉远端并合并
  if(!syncOn() || SYNC.busy) return Promise.resolve(false);
  SYNC.busy = true;
  var remoteImgsVer = 0;
  return dataGet()
    .then(function(r){
      if(r){ mergeRemote(r); remoteImgsVer = Number(r.imgsVer) || 0; }
      if(remoteImgsVer > (S.imgsVer || 0)){
        return imgGet().then(function(im){
          if(im && im.imgs){
            S.imgs = im.imgs;
            S.imgsVer = Number(im.ver) || remoteImgsVer;
            saveLocal();
          }
        }).catch(function(){});
      }
    })
    .then(function(){
      SYNC.busy = false;
      setSyncState('on', syncName());
      return true;
    })
    .catch(function(e){
      SYNC.busy = false;
      setSyncState('err', '同步失败');
      return false;
    });
}

function mergeRemote(remote){
  if(!remote || typeof remote !== 'object') return false;
  var changed = false;
  var rts = Number(remote.ts) || 0;
  if(rts > (S.ts || 0)){
    if(remote.inv && typeof remote.inv === 'object'){ S.inv = remote.inv; changed = true; }
    if(remote.recipes && remote.recipes.length){ S.recipes = remote.recipes; changed = true; }
    if(remote.cats && remote.cats.length){ S.cats = remote.cats; changed = true; }
    if(remote.tags && remote.tags.length){ S.tags = remote.tags; changed = true; }
    if(remote.ingList && remote.ingList.length){ S.ingList = remote.ingList; changed = true; }
    if(remote.users && typeof remote.users === 'object'){
      S.users = S.users || {};
      for(var un in remote.users){
        var ru = remote.users[un] || {}, lu = S.users[un];
        if(!lu){ S.users[un] = ru; changed = true; }
        else if((ru.ts || 0) > (lu.ts || 0)){ S.users[un] = ru; changed = true; }
      }
    }
  }
  var rdel = remote.del || {};
  Object.keys(rdel).forEach(function(k){
    if((rdel[k] || 0) > ((S.del || {})[k] || 0)){ S.del = S.del || {}; S.del[k] = rdel[k]; }
  });
  function dead(o){ return (S.del && S.del[o.id]) ? (S.del[o.id] >= (o.upd || 0)) : false; }
  var map = {};
  (S.orders || []).forEach(function(o){ if(!dead(o)) map[o.id] = o; });
  (remote.orders || []).forEach(function(ro){
    if(dead(ro)) return;
    var lo = map[ro.id];
    if(!lo || (ro.upd || 0) > (lo.upd || 0)){ map[ro.id] = ro; changed = true; }
  });
  var arr = Object.keys(map).map(function(k){ return map[k]; }).filter(function(o){ return !dead(o); });
  arr.sort(function(a,b){ return (b.upd||0) - (a.upd||0); });
  if(arr.length !== (S.orders || []).length) changed = true;
  S.orders = arr;
  if(rts > (S.ts || 0)) S.ts = rts;
  if(remote.seq && remote.seq > S.seq) S.seq = remote.seq;
  if(changed) saveLocal();
  return changed;
}

var PUSH_AGAIN = false;
function push(){                      // 先拉、合并、再推
  if(!syncOn()){ toast('没开同步，只存在这台设备'); return Promise.resolve(false); }
  if(SYNC.busy){ PUSH_AGAIN = true; return Promise.resolve(false); }
  PUSH_AGAIN = false;
  SYNC.busy = true;
  setSyncState('off', '同步中…');
  var remoteImgsVer = 0;
  var snapshot = null;
  return dataGet()
    .catch(function(){ return null; })
    .then(function(remote){
      if(remote){ mergeRemote(remote); remoteImgsVer = Number(remote.imgsVer) || 0; }
      snapshot = {inv:S.inv, orders:S.orders, recipes:S.recipes, seq:S.seq, ts:Math.max(Date.now(), S.ts || 0), imgsVer:S.imgsVer || 0, cats:S.cats || null, tags:S.tags || null, ingList:S.ingList || [], users:S.users || {}, del:S.del || {}, v:7};
      return dataPut(snapshot);
    })
    .then(function(){
      if((S.imgsVer || 0) > remoteImgsVer){
        return imgPut({ver: S.imgsVer, imgs: S.imgs || {}}).catch(function(){});
      }
    })
    .then(function(){
      S.ts = snapshot.ts;
      saveLocal();
      SYNC.busy = false; setSyncState('on', syncName());
      if(PUSH_AGAIN){ PUSH_AGAIN = false; setTimeout(function(){ push(); }, 300); }
      return true;
    })
    .catch(function(e){
      SYNC.busy = false; setSyncState('err', '同步失败');
      toast('同步失败：' + (e && e.message ? e.message : '网络'));
      if(PUSH_AGAIN){ PUSH_AGAIN = false; setTimeout(function(){ push(); }, 1500); }
      return false;
    });
}

function tourFlagKey(name){ return 'kitchen-tour-' + (name || 'x'); }
function tourDone(name){ try{ return localStorage.getItem(tourFlagKey(name)) === '1'; }catch(e){ return true; } }
function startTour(role, force){
  var r = role || CONF.role;
  if(!force && tourDone(CONF.user)) return;
  var steps = TOUR_STEPS[r] || [];
  if(!steps.length) return;
  TOUR = {role:r, i:0, steps:steps};

function tourOpenCheckout(){

function tourPaint(){
  var old = document.querySelector('.tour-hit'); if(old) old.classList.remove('tour-hit');
  if(!TOUR) return;
  var st = TOUR.steps[TOUR.i];
  var box = document.getElementById('tourbox');
  if(!box) return;
  if(st.tab && TAB !== st.tab){ TAB = st.tab; render(); }
  if(st.before && typeof window[st.before] === 'function'){ try{ window[st.before](); }catch(e){} }
  var el = st.sel ? document.querySelector(st.sel) : null;
  if(el){
    el.classList.add('tour-hit');
    try{ el.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){ try{ el.scrollIntoView(); }catch(e2){} }
  }
  var last = TOUR.i === TOUR.steps.length - 1;
  box.innerHTML = '<div class="tstep">第 ' + (TOUR.i + 1) + ' / ' + TOUR.steps.length + ' 步</div>' +
    '<div class="ttitle">' + st.title + '</div>' +
    '<div class="ttext">' + st.text + '</div>' +
    '<div class="tacts"><button class="btn ghost" onclick="endTour()">跳过</button>' +
    '<button class="btn" onclick="tourNext()">' + (last ? '知道了' : '下一步') + '</button></div>';
  box.classList.add('on');
}
function tourNext(){
  if(!TOUR) return;
  TOUR.i++;
  if(TOUR.i >= TOUR.steps.length){ endTour(); return; }
  tourPaint();
}
function endTour(){
  var old = document.querySelector('.tour-hit'); if(old) old.classList.remove('tour-hit');
  var box = document.getElementById('tourbox'); if(box){ box.classList.remove('on'); box.innerHTML = ''; }

function hashPw(str){
  var h = 5381;
  for(var i = 0; i < str.length; i++){ h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; }
  return 'h' + h.toString(36) + 'x' + str.length;
}
function doLogin(){
  var i = document.getElementById('uname');

  if(!name){ toast('先写个名字'); return; }
  if(name.length > 12){ toast('名字短一点'); return; }
  if(pw.length < 2){ toast('密码至少 2 位'); return; }
  S.users = S.users || {};
  var u = S.users[name];
  var isNew = false;
  if(u){
    if(!u.pw){ u.pw = hashPw(pw); u.ts = Date.now(); save(); toast('这个账号第一次设密码，记住它'); }
    else if(u.pw !== hashPw(pw)){ toast('密码不对'); return; }
  } else {
    S.users[name] = {pw: hashPw(pw), roles: {}, like: {tags: [], no: ''}, ts: Date.now()};
    isNew = true;
  }
  u = S.users[name];
  u.roles = u.roles || {};
  u.roles[LOGIN_ROLE] = true;
  u.role = LOGIN_ROLE;
  u.ts = Date.now();
  save();
  enterAs(name, LOGIN_ROLE, isNew);
}

function saveNo(v){
  var L = meLike(); L.no = (v || '').trim(); touchMe(); toast('记住了');
}
function dayKey(){
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function seedOf(str){
  var h = 5381;
  for(var i = 0; i < str.length; i++){ h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; }
  return h;
}
function avoidDish(r){
  var no = (meLike().no || '').replace(/\s+/g, '');
  if(!no) return false;
  var words = no.split(/[，,、;；]+/).filter(function(w){ return w; });
  var hay = r.name + ' ' + r.taste.join(' ') + ' ' + r.need.map(function(x){ return x.n; }).join(' ');
  for(var i = 0; i < words.length; i++){ if(hay.indexOf(words[i]) >= 0) return true; }
  return false;
}
function prefRank(list, seed){
  var tags = meLike().tags || [];
  var scored = list.map(function(r){
    var hit = 0;
    var hayText = r.name + ' ' + r.taste.join(' ') + ' ' + (r.cat || '');
    tags.forEach(function(t){ if(hayText.indexOf(t) >= 0) hit++; });
    return { r: r, s: hit * 10000 + (seedOf(r.id + seed) % 997) };
  });
  scored.sort(function(a, b){ return b.s - a.s; });
  return scored.map(function(x){ return x.r; });
}
function planDay(){
  var all = ALL().filter(function(r){ return !avoidDish(r); });
  var cats = {'荤菜': [], '素菜': [], '主食': [], '汤': [], '甜点': [], '小吃': []};
  all.forEach(function(r){ var c = catOf(r); if(cats[c]) cats[c].push(r); });
  var out = [];
  ['早餐', '午餐', '晚餐'].forEach(function(meal){
    var seed = dayKey() + meal + (CONF.user || '');
    var pick = function(arr, n){ return prefRank(arr, seed).slice(0, n); };
    var dishes;
    if(meal === '早餐'){
      dishes = pick(cats['主食'], 1).concat(pick(cats['素菜'], 1), pick(cats['小吃'].concat(cats['甜点']), 1), pick(cats['汤'], 1));
    } else {
      dishes = pick(cats['荤菜'], 2).concat(pick(cats['素菜'], 1), pick(cats['汤'], 1));
    }
    var seen = {}, uniq = [];
    dishes.forEach(function(r){ if(r && !seen[r.id]){ seen[r.id] = 1; uniq.push(r); } });
    out.push({ meal: meal, dishes: uniq });
  });
  return out;
}
function mealWhy(meal){
  if(meal === '早餐') return '主食顶饱，配点菜和蛋，再来一碗汤润口，早上不腻。';

var NEW_IMG = null;   // null=不改，''=去掉，字符串=新图片
var CATS = ['荤菜','素菜','主食','汤','甜点','小吃'];
function catOf(r){
  if(r && r.cat) return r.cat;

function readImgFile(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var maxW = 300, w = img.width || maxW, h = img.height || maxW;
      if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      if(h > 300){ w = Math.round(w * 300 / h); h = 300; }
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = function(){ cb(''); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- 统计（周/月/年） ---------- */
function statStart(r){
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  if(r === 'week'){ var wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); }
  else if(r === 'month'){ d.setDate(1); }
  else if(r === 'year'){ d.setMonth(0, 1); }
  else return 0;
  return d.getTime();
}
function statOrders(){
  var t0 = statStart(STAT_RANGE);
  return (S.orders || []).filter(function(o){
    if(o.status !== 'done') return false;
    var t = o.doneTs || o.upd || 0;
    return t >= t0;
  });
}

  var list = statOrders();

      dishMap[k] = (dishMap[k] || 0) + (it.n || 1);

    });
  });
  var names = Object.keys(dishMap);
  var rank = names.map(function(k){ return {name:k, n:dishMap[k]}; }).sort(function(a, b){ return b.n - a.n; });

  }).join('') + '<button class="chip" onclick="clearStats()">一键清空排行</button></div>';

  h += '<div class="card" style="margin-bottom:10px"><div style="display:flex;gap:10px;text-align:center">' +
    '<div style="flex:1"><div style="font-size:26px;font-weight:700;color:var(--brand)">' + list.length + '</div><div style="font-size:12px;color:var(--ink2)">做菜次数</div></div>' +
    '<div style="flex:1"><div style="font-size:26px;font-weight:700;color:var(--brand)">' + total + '</div><div style="font-size:12px;color:var(--ink2)">总份数</div></div>' +
    '<div style="flex:1"><div style="font-size:26px;font-weight:700;color:var(--brand)">' + names.length + '</div><div style="font-size:12px;color:var(--ink2)">菜品种类</div></div>' +

  if(!rank.length){
    h += '<div class="empty">' + label[STAT_RANGE] + '还没做完的菜</div>';
  } else {
    h += '<div class="card"><div style="font-weight:700;margin-bottom:8px">点得最多的菜 · Top ' + Math.min(10, rank.length) + '</div>' +
      rank.slice(0, 10).map(function(x, i){

            '<span style="color:var(--ink2)">' + x.n + ' 份</span></div>' +
          '<div style="height:8px;border-radius:6px;background:var(--line);margin-top:4px;overflow:hidden">' +
            '<div style="height:8px;width:' + pct + '%;background:linear-gradient(90deg,var(--brand2),var(--brand))"></div></div>' +
          '</div>';
      }).join('') + '</div>';

      }).join('') + '</div>';

function allCats(){ return (S.cats && S.cats.length) ? S.cats : CATS; }

function ingPool(){ var m = {}; COMMON_INGS.forEach(function(x){ m[x] = 1; }); (S.ingList || []).forEach(function(x){ m[x] = 1; }); Object.keys(S.inv || {}).forEach(function(x){ m[x] = 1; }); return Object.keys(m); }

function guessTime(n){
  if(/粥/.test(n)) return 40;
  if(/汤|炖|藕/.test(n)) return 60;
  if(/红烧|排骨|鱼|鸡|牛肉|鸭/.test(n)) return 45;
  if(/蒸|煎|炒|拌/.test(n)) return 15;
  return 25;
}
function guessLevel(n){
  if(/红烧|炖|卤|清蒸|烤|糖醋|鱼|排骨|虾/.test(n)) return '偏难';
  if(/汤|粥|炒蛋|青菜|凉拌|拍|蒸蛋|羹|炒饭/.test(n)) return '简单';
  return '中等';
}
function guessCat(n){
  if(/汤|羹|粥/.test(n)) return '汤';
  if(/饭|面|粉|馍|饺|包|饼|糕/.test(n)) return '主食';
  if(/糖|甜|布丁|奶|果|拔丝|薯/.test(n)) return '甜点';
  if(/肉|鸡|鱼|虾|排骨|牛|猪|羊|蛋|肠|鸭/.test(n)) return '荤菜';
  return '素菜';
}
function friendlyAmt(a){
  a = String(a || '').trim();
  var m = a.match(/^(\d+(?:\.\d+)?)\s*(kg|千克|公斤)$/);
  if(m){ var kg = parseFloat(m[1]); return kg >= 2 ? (kg + ' 斤') : (kg >= 1 ? '两斤' : '一斤'); }
  m = a.match(/^(\d+(?:\.\d+)?)\s*(g|克)$/);
  if(m){
    var g = parseFloat(m[1]);
    if(g >= 750) return '一斤半';
    if(g >= 450) return '一斤';
    if(g >= 350) return '大半斤';
    if(g >= 220) return '半斤';
    if(g >= 160) return '三四个';
    if(g >= 90) return '二两';
    if(g >= 50) return '一两';
    return '一点点';
  }
  m = a.match(/^(\d+(?:\.\d+)?)\s*(ml|毫升)$/);
  if(m){
    var ml = parseFloat(m[1]);
    if(ml >= 600) return '两大碗';
    if(ml >= 300) return '一大碗';
    if(ml >= 150) return '半碗';
    if(ml >= 40) return '两三勺';
    return '一点点';
  }
  m = a.match(/^(\d+(?:\.\d+)?)\s*(斤|两)$/);
  if(m){ var n = parseFloat(m[1]); return n === 1 ? ('一' + m[2]) : (n + m[2]); }
  return a;
}

  }).join('') + '<button class="chip" onclick="addTag()">＋ 新标签</button></div>';

  }).join('') + '<button class="chip" onclick="addNeedName()">＋ 加一样</button></div>';
  h += '<div class="row" style="align-items:flex-start;margin-top:8px"><textarea id="rNeed" placeholder="也可以自己写，一样一行，比如：番茄 2个">' + esc(d.need) + '</textarea></div>';

  h += '<div class="row" style="align-items:flex-start"><label style="padding-top:9px">一句话介绍</label><textarea id="rIntro" placeholder="比如：全家都爱抢着吃">' + esc(d.intro) + '</textarea></div>';

function needCount(name){
  var lines = (EDIT_DRAFT.need || '').split('\n');
  for(var i = 0; i < lines.length; i++){
    var m = lines[i].trim().match(/^(.+?)\s*×\s*(\d+)$/);
    if(m && m[1].trim() === name) return parseInt(m[2], 10) || 0;
  }
  return 0;
}
function needPick(name, d){
  readEditForm();
  var lines = (EDIT_DRAFT.need || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
  var idx = -1, cnt = 0;
  for(var i = 0; i < lines.length; i++){
    var m = lines[i].match(/^(.+?)\s*×\s*(\d+)$/);
    if(m && m[1].trim() === name){ idx = i; cnt = parseInt(m[2], 10) || 0; break; }
  }
  if(d > 0){
    cnt = cnt + 1;
    var line = name + ' ×' + cnt;
    if(idx >= 0) lines[idx] = line; else lines.push(line);
  } else {
    cnt = cnt - 1;
    if(cnt <= 0){ if(idx >= 0) lines.splice(idx, 1); }
    else if(idx >= 0) lines[idx] = name + ' ×' + cnt;
  }
  EDIT_DRAFT.need = lines.join('\n');
  editRecipe(EDIT_ID, 'redraw');
}
function addNeedName(){

  if(COMMON_INGS.indexOf(n) < 0 && S.ingList.indexOf(n) < 0) S.ingList.push(n);
  needPick(n, 1);
  if(syncOn()) push();
}

}
function addTag(){

function addTime(){
  var v = prompt('大概多少分钟？', String(EDIT_DRAFT.time || 30));
  if(!v) return;

}
function saveRecipe(){
  readEditForm();
  var d = EDIT_DRAFT || {};
  var name = (d.name || '').trim();
  if(!name){ toast('先点一个菜名，或者自己写一个'); return; }
  var need = (d.need || '').split('\n').map(function(s){ return s.trim(); }).filter(Boolean).map(function(line){
    var t = line.match(/^(.+?)\s*×\s*(\d+)$/);
    if(t) return {n: t[1].trim(), a: (parseInt(t[2], 10) > 1 ? t[2] + '份' : '适量')};
    var m = line.match(/^([^\d\s]+)\s*(.*)$/);
    return m ? {n: m[1], a: m[2] || '适量'} : {n: line, a: '适量'};
  });
  var steps = (d.steps || '').split('\n').map(function(s){ return s.trim().replace(/^\d+[.、)]\s*/, ''); }).filter(Boolean);
  var obj = {
    id: EDIT_ID || ('c' + Date.now()),
    name: name,
    time: parseInt(d.time, 10) || 20,
    level: d.level || '中等',
    cat: d.cat || guessCat(name),
    taste: (d.taste && d.taste.length) ? d.taste : ['自己做'],
    need: need,
    steps: steps,
    intro: (d.intro || '').trim(),
    tip: (d.tip || '').trim(),
    custom: true
  };
  if(!S.imgs) S.imgs = {};
  if(NEW_IMG !== null){
    if(NEW_IMG){ S.imgs[obj.id] = NEW_IMG; } else { delete S.imgs[obj.id]; }
    S.imgsVer = Date.now();
  }
  if(EDIT_ID){
    var hit = false;
    for(var i=0;i<S.recipes.length;i++){ if(S.recipes[i].id === EDIT_ID){ S.recipes[i] = obj; hit = true; break; } }
    if(!hit) S.recipes.push(obj);
  } else {
    S.recipes.push(obj);
  }
  save(); closeSheet(); render(); toast(EDIT_ID ? '改好了' : '加进菜谱了');
  if(syncOn()) push();
}

function delRecipe(id){
  var sd = isSeed(id);
  if(!confirm(sd ? '这道菜恢复成原来的样子？（你改的内容会没）' : '删掉这道菜？')) return;
  S.recipes = (S.recipes || []).filter(function(x){ return x.id !== id; });
  if((S.imgs || {})[id]){ delete S.imgs[id]; S.imgsVer = Date.now(); }
  save(); closeSheet(); render(); toast(sd ? '恢复原样了' : '删了');
  if(syncOn()) push();
}

/* ---------- 有啥菜 ---------- */
function viewInv(){
  var names = Object.keys(S.inv).sort();
  var h = '<div class="tipbar">记「家里现在有啥」，点菜页就会告诉你哪些能做、缺什么。可以一次加几样，用逗号或换行分开。</div>';
  h += '<div class="row"><input id="ingName" list="ingList" placeholder="例：番茄 2个"><datalist id="ingList">' +
       COMMON_INGS.map(function(x){ return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>' +
       '<button class="btn mini" onclick="addIng()">加上</button></div>';
  var pool = ingPool();
  h += '<div style="font-size:12px;color:#9b8577;margin:8px 0 4px">点一下就算有（再点一下取消），没有的按「＋」自己加</div>';
  h += '<div class="frmpick">' + pool.map(function(x){
    var on = S.inv[x] != null;
    return '<button class="chip' + (on ? ' on' : '') + '" onclick="tapIng(\'' + esc(x) + '\')">' + esc(x) + (on ? ' ✓' : '') + '</button>';
  }).join('') + '<button class="chip" onclick="addIngName()">＋ 新的一样</button></div>';
  h += '<div class="meta" style="margin:6px 0 10px;color:var(--ink2);font-size:12px">共 ' + names.length + ' 样</div>';
  if(!names.length) h += '<div class="empty">还没记材料</div>';
  names.forEach(function(n){
    h += '<div class="ing"><b>' + esc(n) + '</b><span>' + esc(S.inv[n] || '') + '</span>' +
      '<button class="x" onclick="delIng(this)" data-n="' + esc(n) + '">用完</button></div>';
  });
  h += '<div style="display:flex;gap:8px;margin-top:14px">' +
    '<button class="btn ghost" style="flex:1" onclick="quickFill()">加常见调料</button>' +
    '<button class="btn gray" onclick="resetAll()">清空本机数据</button></div><div style="height:20px"></div>';
  return h;
}
function addIng(){
  var el = document.getElementById('ingName');
  var v = (el.value || '').trim(); if(!v) return;
  var parts = v.split(/[，,、\n;；]+/).map(function(s){ return s.trim(); }).filter(Boolean);
  parts.forEach(function(p){
    var m = p.match(/^([^\d\s]+)\s*(.*)$/);
    var name = m ? m[1] : p;
    var amount = m ? (m[2] || '') : '';
    S.inv[name] = amount || '有';
    if(COMMON_INGS.indexOf(name) < 0){
      if(!S.ingList) S.ingList = [];
      if(S.ingList.indexOf(name) < 0) S.ingList.push(name);
    }
  });
  save(); el.value = ''; render(); toast('记上了');
  if(syncOn()) push();
}
function addIngName(){
  var n = prompt('家里还有啥？比如：青椒', '');
  if(!n) return;
  n = n.trim(); if(!n) return;
  if(!S.ingList) S.ingList = [];
  if(COMMON_INGS.indexOf(n) < 0 && S.ingList.indexOf(n) < 0) S.ingList.push(n);
  S.inv[n] = S.inv[n] || '有';
  save(); render(); toast('加上了');
  if(syncOn()) push();
}
function tapIng(name){
  if(S.inv[name] != null){ delete S.inv[name]; toast('去掉了'); }
  else { S.inv[name] = '有'; toast('记上了'); }
  save(); render();
  if(syncOn()) push();
}
function delIng(btn){
  var n = btn.getAttribute('data-n');
  delete S.inv[n]; save(); render(); toast('用完了');
  if(syncOn()) push();
}
function quickFill(){
  ['生抽','老抽','醋','料酒','糖','盐','淀粉','蚝油','香油','花椒','八角'].forEach(function(x){ if(!S.inv[x]) S.inv[x] = '有'; });
  save(); render(); toast('调料补齐了');
  if(syncOn()) push();
}
function resetAll(){
  if(!confirm('清空本机的材料和单子？（云端不受影响）')) return;
  localStorage.removeItem(KEY); S = loadData(); save(); render(); toast('清空了');
}

/* ---------- 同步设置 / 说明 ---------- */
function openSync(){
  sheet('<h2>同步设置<button class="close" onclick="closeSheet()">关</button></h2>' +
    '<div class="tipbar">' + (syncOn() ? '现在是「' + syncName() + '」，6 秒自动同步一次，谁都不用设置。' : '同步没开，只在这台设备上有效。') + '</div>' +
    '<div class="row"><label>账号</label><input id="cOwner" value="' + esc(CONF.owner) + '" placeholder="GitHub 用户名"></div>' +
    '<div class="row"><label>仓库</label><input id="cRepo" value="' + esc(CONF.repo) + '" placeholder="kitchen"></div>' +
    '<div class="row"><label>数据文件</label><input id="cPath" value="' + esc(CONF.path) + '" placeholder="data/kb.json"></div>' +
    '<div class="row"><label>备份令牌</label><input id="cToken" type="password" value="' + esc(CONF.token) + '" placeholder="可选，ghp_..."></div>' +
    '<div style="display:flex;gap:8px;margin-top:10px">' +
      '<button class="btn" style="flex:1" onclick="saveSync()">保存并测试</button>' +
      '<button class="btn gray" onclick="clearSync()">关掉同步</button></div>' +
    '<div class="tip">上面三项平时不用动。想让数据额外备份进 GitHub 仓库，才需要填令牌（repo 权限）。</div>');
}
function saveSync(){
  CONF.owner = (document.getElementById('cOwner').value || '').trim();
  CONF.repo = (document.getElementById('cRepo').value || '').trim();
  CONF.path = (document.getElementById('cPath').value || '').trim() || 'data/kb.json';
  CONF.token = (document.getElementById('cToken').value || '').trim();
  saveConf(); closeSheet();
  toast('测试中…');
  pull().then(function(ok){
    if(ok) toast('同步通了');
    else if(SYNC.state === 'err') toast('没通：' + SYNC.msg);
    else { toast('连上了，云端还没数据，下第一单会建'); }
    render();
  });
}
function clearSync(){ CONF.token = ''; saveConf(); setSyncState('off', '仅本机'); closeSheet(); render(); toast('已关掉同步'); }
function openAbout(){
  sheet('<h2>怎么用<button class="close" onclick="closeSheet()">关</button></h2>' +
    '<div class="intro">1. 进来先选身份：点菜的 / 做饭的。<br>2. 点菜的：在「有啥菜」记家里材料 → 点菜页看「现在能做」→ 加入点菜单 → 去下单（可预约时间、写备注）。<br>3. 做饭的：在「做菜」看到单子 → 开始做 → 点「看点啥 & 咋做」看用料和步骤 → 做好了。<br>4. 两边都配了同步，状态会自己更新。</div>' +
    '<button class="btn" style="width:100%;margin-top:10px" onclick="closeSheet()">知道了</button>');
}

/* ---------- 弹层 ---------- */
function sheet(html){ $('#sheet').innerHTML = html; $('#mask').classList.add('on'); }
function closeSheet(){ $('#mask').classList.remove('on'); }
$('#mask').addEventListener('click', function(e){ if(e.target === this) closeSheet(); });

/* ---------- 启动 ---------- */
TAB = (CONF.role === 'cook' ? 'cook' : 'order');
render();
setSyncState('off', syncOn() ? syncName() : '仅本机');
if(syncOn()){ pull().then(function(ok){ if(ok) render(); }); }
setInterval(function(){
  if(!syncOn() || !CONF.role) return;
  if(document.hidden) return;
  if(SYNC.busy) return;
  if($('#mask').classList.contains('on')) return;                       // 弹层开着别刷
  var ae = document.activeElement;
  if(ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return; // 正在输入别刷
  pull().then(function(ok){ if(ok) render(); });
}, 10000);
</script>
